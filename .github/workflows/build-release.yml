name: Build Release (reusable)

# Shared by release.yml (stable) and release-rc.yml (release candidate).
# Called with prerelease: true/false so both pipelines build identically
# and only differ in how the GitHub Release gets flagged.
on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        required: true

jobs:
  # Step 0: same syntax + E2E gate as every main push/PR (ci.yml) — a broken
  # build should never get published as a release, not just blocked from main.
  check:
    uses: ./.github/workflows/check.yml

  # Step 1: create the GitHub release once check passes and before any build starts
  create-release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed to access full tag history

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # compare API → contributor logins
        run: |
          python3 - <<'PYEOF'
          import subprocess, os, re
          from datetime import date

          curr = subprocess.getoutput("git describe --tags --exact-match HEAD 2>/dev/null").strip()
          if not curr:
              curr = subprocess.getoutput("git rev-parse --short HEAD").strip()
              print(f"Warning: no exact tag found, using commit SHA: {curr}")

          # git's default tag sort has no concept of semver prerelease precedence, so a
          # bare "v1.1.0" can sort BELOW "v1.1.0-rc.14" there — picking the RC as "prev"
          # for the stable release yields a near-empty diff (just the version-bump
          # commit). Sort by creation time instead, which always matches true release
          # chronology regardless of version-string suffixes.
          stable_re = re.compile(r'^v?\d+\.\d+\.\d+$')
          all_tags  = subprocess.getoutput("git tag --sort=-creatordate").splitlines()
          candidates = [t for t in all_tags if t and t != curr]
          if stable_re.match(curr):
              # A stable release's notes should summarize everything since the last
              # STABLE tag, not just the last RC — RC-vs-stable would be near-empty.
              candidates = [t for t in candidates if stable_re.match(t)]
          prev = candidates[0] if candidates else ''

          range_arg = f"{prev}..HEAD" if prev else "HEAD"
          # --first-parent: only the release branch's own commits. Contributor branches
          # merged with their history intact (e.g. `-s ours` after a squash) would
          # otherwise dump every unconventional side commit into "Other Changes".
          raw = subprocess.getoutput(f"git log --first-parent --pretty=format:%s {range_arg}").splitlines()

          cats = {"Features": [], "Bug Fixes": [], "Improvements": [], "Other Changes": []}
          skip = re.compile(r"^(bump version|docs|merge )", re.I)
          feat = re.compile(r"^add ", re.I)
          fix  = re.compile(r"^fix ", re.I)
          impr = re.compile(r"^(update|improve|refactor) ", re.I)

          for line in raw:
              if not line.strip() or skip.match(line): continue
              if feat.match(line):   cats["Features"].append(line)
              elif fix.match(line):  cats["Bug Fixes"].append(line)
              elif impr.match(line): cats["Improvements"].append(line)
              else:                  cats["Other Changes"].append(line)

          # ── Contributors ──────────────────────────────────────────────────────
          # Unlike the categories above, this walks ALL commits in range (side
          # branches included) plus Co-authored-by trailers, so contributors whose
          # work landed via merge or squash are still credited. GitHub logins come
          # from the compare API; if that fails, fall back to git author names.
          noreply_re = re.compile(r"^(?:\d+\+)?([^@]+)@users\.noreply\.github\.com$", re.I)
          def is_bot(name, email, login="", kind=""):
              m = noreply_re.match(email)
              handle = (login or (m.group(1) if m else "")).lower()
              return (kind == "Bot" or handle.endswith("[bot]") or handle == "copilot"
                      or "[bot]" in name.lower() or "[bot]" in email.lower()
                      or name.lower() in ("copilot", "github")
                      or email.lower().endswith("@anthropic.com")
                      or email.lower() == "noreply@github.com")

          people = {}   # dedupe key → display string
          def credit(name, email, login="", kind=""):
              if is_bot(name, email, login, kind): return
              m = noreply_re.match(email)
              login = login or (m.group(1) if m else "")
              key = (login or email or name).lower()
              people.setdefault(key, f"@{login}" if login else name)

          head = subprocess.getoutput("git rev-parse HEAD").strip()
          api_ok = False
          if prev:
              r = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{os.environ['GITHUB_REPOSITORY']}/compare/{prev}...{head}",
                   "--jq", '.commits[] | [.author.login // "", .author.type // "", .commit.author.name, .commit.author.email] | @tsv'],
                  capture_output=True, text=True)
              if r.returncode == 0:
                  api_ok = True
                  for row in r.stdout.splitlines():
                      login, kind, name, email = (row.split("\t") + ["", "", "", ""])[:4]
                      credit(name, email, login, kind)
          if not api_ok:
              for row in subprocess.getoutput(f"git log --format=%an%x09%ae {range_arg}").splitlines():
                  name, _, email = row.partition("\t")
                  credit(name, email)
          trailers = subprocess.getoutput(
              f"git log --format='%(trailers:key=Co-authored-by,valueonly,separator=%x0A)' {range_arg}")
          for t in trailers.splitlines():
              m = re.match(r"\s*(.+?)\s*<([^>]+)>", t)
              if m: credit(m.group(1), m.group(2))

          today = date.today().isoformat()
          sections = [f"## {curr} — {today}\n"]
          for title, items in cats.items():
              if items:
                  sections.append(f"### {title}")
                  sections.extend(f"- {i}" for i in items)
                  sections.append("")
          # A git name with no resolvable login (non-noreply email, API unavailable)
          # can duplicate someone already credited by @login — keep the @login.
          handles = {p[1:].lower() for p in people.values() if p.startswith("@")}
          credited = sorted({p for p in people.values()
                             if p.startswith("@") or p.lower() not in handles}, key=str.lower)
          if credited:
              sections.append("### Contributors")
              sections.extend(f"- {p}" for p in credited)
              sections.append("")

          body = "\n".join(sections)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"body<<BODYEOF\n{body}\nBODYEOF\n")
          PYEOF

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          body: ${{ steps.changelog.outputs.body }}

  # Step 2: build on each OS and upload artifacts to the release
  build:
    name: Build & upload — ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: node scripts/gen-icon.js ${{ inputs.prerelease && '--channel=rc' || '' }}

      - name: Build & upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }} -- --publish always

      # Stable releases only — uploads a copy of each installer under a fixed,
      # version-less filename so README "Download" links via
      # /releases/latest/download/<name> always resolve to the current build
      # without needing to be updated on every release.
      - name: Upload direct-download aliases
        if: ${{ !inputs.prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              cp dist/SPulse-Setup-*.exe dist/SPulse-latest-win.exe
              gh release upload "${{ github.ref_name }}" dist/SPulse-latest-win.exe --clobber
              ;;
            macos-latest)
              cp dist/SPulse-*-arm64.dmg dist/SPulse-latest-mac-arm64.dmg
              cp $(ls dist/SPulse-*.dmg | grep -v arm64) dist/SPulse-latest-mac-x64.dmg
              gh release upload "${{ github.ref_name }}" dist/SPulse-latest-mac-arm64.dmg dist/SPulse-latest-mac-x64.dmg --clobber
              ;;
            ubuntu-latest)
              cp dist/SPulse-*.AppImage dist/SPulse-latest-linux.AppImage
              gh release upload "${{ github.ref_name }}" dist/SPulse-latest-linux.AppImage --clobber
              ;;
          esac
